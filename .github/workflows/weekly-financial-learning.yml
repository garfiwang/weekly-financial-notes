name: 每週財經週報雲端自動研讀 (波克夏心法)

on:
  schedule:
    # 每週一 09:00 UTC = 每週一 17:00 台北時間 (Asia/Taipei)
    - cron: '0 9 * * 1'
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊「Run workflow」

permissions:
  contents: write

jobs:
  auto-learn:
    name: 雲端不斷電自動研讀與知識庫更新
    runs-on: ubuntu-latest

    steps:
      - name: 簽出專案儲存庫
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 執行自動研讀與知識庫更新腳本
        run: |
          python3 scripts/auto_learn_weekly_reports.py

      - name: 自動提交並推送更新至儲存庫
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git status
          if [ -n "$(git status --porcelain)" ]; then
            git add 財經週報學習總綱與波克夏投資決策知識庫.md handoff.md
            git commit -m "chore(auto-learn): 每週財經週報雲端自動研讀與波克夏知識庫更新 [skip ci]"
            git push origin main
            echo "✅ 成功完成雲端自動研讀與知識庫更新推送！"
          else
            echo "ℹ️ 本週無新增資料或內容已是最新，無需推送。"
          fi
